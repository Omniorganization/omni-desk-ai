services:
  postgres:
    image: ${OMNIDESK_POSTGRES_IMAGE:?set OMNIDESK_POSTGRES_IMAGE to postgres:16 digest-pinned image, e.g. postgres:16@sha256:...}
    container_name: omnidesk-postgres
    restart: unless-stopped
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official entrypoint chowns PGDATA and switches to the postgres user;
    # with no capabilities at all it cannot start. These are the only ones it needs.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: ${OMNIDESK_POSTGRES_MEM_LIMIT:-768m}
    cpus: ${OMNIDESK_POSTGRES_CPUS:-1.0}
    pids_limit: 256
    environment:
      POSTGRES_DB: ${OMNIDESK_POSTGRES_DB:-omnidesk}
      POSTGRES_USER: ${OMNIDESK_POSTGRES_USER:-omnidesk}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - omnidesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OMNIDESK_POSTGRES_USER:-omnidesk} -d ${OMNIDESK_POSTGRES_DB:-omnidesk}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - omnidesk-private

  omnidesk:
    image: ${OMNIDESK_IMAGE:?set OMNIDESK_IMAGE to a digest-pinned image, e.g. ghcr.io/acme/omnidesk@sha256:...}
    container_name: omnidesk-agent
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:18789:18789"
    mem_limit: ${OMNIDESK_GATEWAY_MEM_LIMIT:-1g}
    cpus: ${OMNIDESK_GATEWAY_CPUS:-1.5}
    pids_limit: 512
    environment:
      OMNIDESK_ENV: production
      OMNIDESK_REQUIRE_PRODUCTION_GUARDS: "true"
      OMNIDESK_RUNNING_IN_CONTAINER: "1"
      OMNIDESK_CONFIG: /data/config.production.yaml
      # Every secret omnidesk_agent/validation/production.py requires at boot.
      OMNIDESK_ADMIN_TOKEN: ${OMNIDESK_ADMIN_TOKEN:?required}
      OMNIDESK_VIEWER_TOKEN: ${OMNIDESK_VIEWER_TOKEN:?required for the metrics scrape}
      OMNIDESK_GATEWAY_SECRET: ${OMNIDESK_GATEWAY_SECRET:?required}
      OMNIDESK_MEMORY_ENCRYPTION_KEY: ${OMNIDESK_MEMORY_ENCRYPTION_KEY:?required Fernet key}
      OMNIDESK_PLUGIN_SIGNING_SECRET: ${OMNIDESK_PLUGIN_SIGNING_SECRET:?required}
      OMNIDESK_AUDIT_CHECKPOINT_HMAC_KEY: ${OMNIDESK_AUDIT_CHECKPOINT_HMAC_KEY:?required}
      OMNIDESK_POSTGRES_DSN: ${OMNIDESK_POSTGRES_DSN:?set OMNIDESK_POSTGRES_DSN}
      OMNIDESK_APPSYNC_POSTGRES_DSN: ${OMNIDESK_APPSYNC_POSTGRES_DSN:-${OMNIDESK_POSTGRES_DSN}}
      OMNIDESK_APPSYNC_SECRET_PEPPER: ${OMNIDESK_APPSYNC_SECRET_PEPPER:?required}
      # The image is pulled by this digest, so /health reports what is running.
      OMNIDESK_IMAGE_DIGEST: ${OMNIDESK_IMAGE_DIGEST:?set to the digest in OMNIDESK_IMAGE}
      OMNIDESK_OTLP_ENDPOINT: ${OMNIDESK_OTLP_ENDPOINT:-}
      OMNIDESK_SANDBOX_RUNNER_TOKEN: ${OMNIDESK_SANDBOX_RUNNER_TOKEN:?required}
      OMNIDESK_SANDBOX_RUNNER_HMAC_SECRET: ${OMNIDESK_SANDBOX_RUNNER_HMAC_SECRET:?required}
      OMNIDESK_SANDBOX_IMAGE_ALLOWLIST: ${OMNIDESK_SANDBOX_IMAGE_ALLOWLIST:?required digest-pinned sandbox image allowlist}
      OMNIDESK_CONTAINER_RUNTIME: ${OMNIDESK_CONTAINER_RUNTIME:-docker}
      OMNIDESK_CONTAINER_SOCKET_PATH: ${OMNIDESK_CONTAINER_SOCKET_PATH:?set to the dedicated rootless runner user's podman socket}
    volumes:
      - omnidesk-data:/data
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18789/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      # Postgres and the runner are reachable only on the internal network. The
      # gateway alone also joins an egress network: model providers and channel
      # APIs are outside the host, and an internal-only network cannot publish
      # the loopback port above either. Host-level egress is limited by the
      # cloud firewall's owner-approved destinations.
      - omnidesk-private
      - omnidesk-egress

  sandbox-runner:
    image: ${OMNIDESK_SANDBOX_RUNNER_IMAGE:?set OMNIDESK_SANDBOX_RUNNER_IMAGE to a digest-pinned image}
    container_name: omnidesk-sandbox-runner
    restart: unless-stopped
    read_only: true
    privileged: false
    # Run as the dedicated rootless-runtime user that owns the socket below;
    # the image's own user cannot open another user's socket.
    user: "${OMNIDESK_RUNNER_UID:?uid of the dedicated rootless runner user}:${OMNIDESK_RUNNER_GID:?gid of that user}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${OMNIDESK_RUNNER_MEM_LIMIT:-512m}
    cpus: ${OMNIDESK_RUNNER_CPUS:-1.0}
    pids_limit: 256
    environment:
      OMNIDESK_ENV: production
      OMNIDESK_REQUIRE_PRODUCTION_GUARDS: "true"
      OMNIDESK_SANDBOX_RUNNER_TOKEN: ${OMNIDESK_SANDBOX_RUNNER_TOKEN:?required}
      OMNIDESK_SANDBOX_RUNNER_HMAC_SECRET: ${OMNIDESK_SANDBOX_RUNNER_HMAC_SECRET:?required}
      OMNIDESK_SANDBOX_REQUIRE_HMAC: "1"
      OMNIDESK_SANDBOX_IMAGE_ALLOWLIST: ${OMNIDESK_SANDBOX_IMAGE_ALLOWLIST:?required digest-pinned sandbox image allowlist}
      OMNIDESK_SANDBOX_NONCE_DB: /runner-state/nonces.sqlite3
      OMNIDESK_SANDBOX_ALLOWED_WORKSPACE_ROOT: /srv/omnidesk-sandbox-workspaces
      TMPDIR: /srv/omnidesk-sandbox-workspaces/tmp
      HOME: /runner-state
      OMNIDESK_CONTAINER_RUNTIME: ${OMNIDESK_CONTAINER_RUNTIME:-docker}
      DOCKER_HOST: ${OMNIDESK_CONTAINER_RUNTIME_HOST:-unix:///run/podman/podman.sock}
      OMNIDESK_CONTAINER_SOCKET_PATH: ${OMNIDESK_CONTAINER_SOCKET_PATH:?set to the dedicated rootless runner user's podman socket}
    expose:
      - "18890"
    volumes:
      - ${OMNIDESK_RUNNER_STATE_DIR:?host directory owned by the runner user}:/runner-state
      # Sandbox containers are created by the host engine, which resolves
      # bind-mount sources on the host: the workspace root (and the runner's
      # TMPDIR inside it) must be the same path on both sides.
      - /srv/omnidesk-sandbox-workspaces:/srv/omnidesk-sandbox-workspaces
      # A read-only bind mount does not restrict the container API; isolation comes
      # from the socket being rootless (the runner refuses to start on a rootful one
      # unless OMNIDESK_SANDBOX_ALLOW_ROOTFUL_RUNTIME=1) and from a dedicated host.
      - ${OMNIDESK_CONTAINER_SOCKET_PATH:?set to the dedicated rootless runner user's podman socket}:/run/podman/podman.sock
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18890/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - omnidesk-private

secrets:
  postgres_password:
    file: ${OMNIDESK_POSTGRES_PASSWORD_FILE:?path to postgres password file}

networks:
  omnidesk-private:
    driver: bridge
    internal: true
  omnidesk-egress:
    driver: bridge

volumes:
  omnidesk-data:
  omnidesk-postgres:
