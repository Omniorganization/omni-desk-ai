global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: omnidesk-agent
    metrics_path: /admin/metrics
    scheme: http
    static_configs:
      - targets:
          - omnidesk:18789
    # /admin/metrics requires an AdminAuth viewer token; without it every scrape is a 403.
    authorization:
      credentials_file: /run/secrets/omnidesk_metrics_token
