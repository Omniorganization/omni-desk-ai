# Alertmanager routing for OmniDesk. Receivers are rendered by
# scripts/render_alertmanager_config.py (the chat id and the webhook URL are
# deployment values; the bot token is only ever a file). Alerts go straight
# from Alertmanager to the on-call channel, never through the OmniDesk
# gateway, so an OmniDesk outage cannot suppress its own alerts.
route:
  receiver: omnidesk-oncall
  group_by: [alertname, slo, reason, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - receiver: omnidesk-oncall
      matchers: ['severity="critical"']
      group_wait: 10s
      repeat_interval: 1h
    - receiver: omnidesk-oncall
      matchers: ['severity="warning"']
      repeat_interval: 12h
inhibit_rules:
  # While the gateway is down every other gateway alert is noise.
  - source_matchers: ['alertname="OmniDeskGatewayDown"']
    target_matchers: ['alertname=~"OmniDesk(Availability|Latency).*|OmniDeskTrace.*"']
  # A fast burn already pages; do not also send the slow-burn ticket.
  - source_matchers: ['alertname="OmniDeskAvailabilityBudgetFastBurn"']
    target_matchers: ['alertname="OmniDeskAvailabilityBudgetSlowBurn"']
  - source_matchers: ['alertname="OmniDeskHostDiskCritical"']
    target_matchers: ['alertname="OmniDeskHostDiskFillingUp"']
    equal: [instance, mountpoint]
