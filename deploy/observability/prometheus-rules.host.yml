# Single-host (staging / budget host) rules: node_exporter host signals and the
# out-of-process backup job. `scripts/verify_backup.py --metrics-file
# <node_exporter textfile dir>/omnidesk_backup.prom` (docs/BACKUP_RESTORE.md)
# writes omnidesk_backup_last_verify_success_timestamp_seconds{kind} and
# omnidesk_backup_verify_failure_total{kind}, kind = sqlite | postgres. Loaded
# only where node_exporter runs; pinned by deploy/observability/prometheus-rules.test.yml.
groups:
  - name: omnidesk-host
    rules:
      - alert: OmniDeskNodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: node_exporter on {{ $labels.instance }} is down
          description: Host disk, memory, clock and backup alerts are blind while node_exporter is down.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnidesknodeexporterdown
      - alert: OmniDeskHostDiskFillingUp
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free'
          description: Postgres, backups and container images share this disk. Prune old images and backups before Postgres stops accepting writes.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnideskhostdiskfillingup
      - alert: OmniDeskHostDiskCritical
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} is almost full ({{ $value | humanizePercentage }} free)'
          description: Postgres will fail writes and the gateway will stop accepting work.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnideskhostdiskcritical
      - alert: OmniDeskHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Host memory available is {{ $value | humanizePercentage }}'
          description: The OOM killer will soon pick Postgres, the gateway or the sandbox runner.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnideskhostmemorylow
      - alert: OmniDeskHostClockNotSynchronised
        expr: node_timex_sync_status == 0 or abs(node_timex_offset_seconds) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host clock is not synchronised
          description: Signed sandbox-runner requests, device signatures, approvals and TLS all depend on the clock. Check NTP egress (UDP 123) and timesyncd.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnideskhostclocknotsynchronised

  - name: omnidesk-backup
    rules:
      - alert: OmniDeskBackupMissing
        expr: absent(omnidesk_backup_last_verify_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: No verified OmniDesk backup has been recorded
          description: No backup on this host has passed verify_backup.py yet, or it runs without --metrics-file, or node_exporter's textfile directory is not mounted.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnideskbackupmissing
      - alert: OmniDeskBackupStale
        expr: time() - omnidesk_backup_last_verify_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The last verified OmniDesk backup is older than 26 hours
          description: No backup has passed verification for 26 hours, so the recovery point objective (24h) is no longer met.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnideskbackupstale
      - alert: OmniDeskBackupVerifyFailure
        expr: increase(omnidesk_backup_verify_failure_total[24h]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: OmniDesk backup verification failed
          description: verify_backup.py rejected the latest backup set (checksum, decryption, integrity or trial restore); do not rely on it for recovery.
          runbook_url: https://github.com/Omniorganization/omni-desk-ai/blob/main/docs/runbooks/ALERTS.md#omnideskbackupverifyfailure
