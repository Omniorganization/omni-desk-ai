#cloud-config
package_update: true
package_upgrade: true
ssh_pwauth: false
disable_root: false
packages:
  - ca-certificates
  - docker.io
  - docker-compose-v2
  - podman
  - uidmap
  - slirp4netns
  - unattended-upgrades
  - jq
write_files:
  - path: /etc/ssh/sshd_config.d/60-omnidesk.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      AllowTcpForwarding no
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}
runcmd:
  - [systemctl, enable, --now, docker]
  - [systemctl, restart, ssh]
  - [install, -d, -m, '0700', /opt/omnidesk]
# No application, credential, private key, sandbox socket or CI runner is installed.
# Bootstrap the rootless sandbox and verified release separately after approvals.
