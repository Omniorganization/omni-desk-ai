image:
  repository: ghcr.io/omniorganization/omni-desk-ai/omnidesk-agent # pushed by .github/workflows/release.yml
  digest: "" # required: release pipeline must inject the final OmniDesk app OCI digest
  pullPolicy: IfNotPresent
replicaCount: 3
secrets:
  name: omnidesk-secrets
service:
  type: ClusterIP
  port: 18789
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      percent: 100
      periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      percent: 25
      periodSeconds: 60
  customMetrics:
    enabled: false
    activeChatStreamsAverageValue: "40"
    postgresPoolWaitersAverageValue: "2"
pdb:
  enabled: true
  minAvailable: 2
otel:
  endpoint: http://otel-collector:4318/v1/traces
storage:
  backend: postgres
  namespace: production
  requireMultiInstanceSafe: true
  postgresPoolSize: 12
  chatRequestLeaseSeconds: 180
postgresConnectionBudget:
  maxConnections: 120
  reservedAdminConnections: 10
  workerConnections: 20
  migrationConnections: 2
  monitoringConnections: 4
config:
  publicBaseUrl: https://omnidesk.ai.internal
  sandboxRunnerUrl: http://sandbox-runner:18890
  # Ingress/proxy pod IPs or CIDRs whose X-Forwarded-For is honored (read right to left).
  trustedProxyIps: []
sandboxRunner:
  # The runner needs a rootless container runtime, which a pod under the
  # restricted Pod Security profile cannot provide, so it runs on dedicated
  # runner hosts (deploy/sandbox-runner.service or deploy/sandbox-runner/).
  # The chart publishes those hosts in-cluster as the `sandbox-runner` Service
  # that config.sandboxRunnerUrl points at; readiness fails until one answers.
  repository: ghcr.io/omniorganization/omni-desk-ai/omnidesk-sandbox-runner
  digest: "" # required: runner image digest must be pinned (deployed on the runner hosts)
  external:
    addresses: [] # required: runner host IPv4 addresses reachable from the gateway pods
    port: 18890
migrations:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClassName: standard
  scratchSizeLimit: 1Gi
networkPolicy:
  enabled: true
  ingressNamespaceLabel:
    kubernetes.io/metadata.name: ingress-nginx
  ingressPodLabel:
    app.kubernetes.io/name: ingress-nginx
  # Prometheus scrapes /admin/metrics with a viewer token (service-monitor.yaml).
  metricsNamespaceLabel:
    kubernetes.io/metadata.name: monitoring
  # Cluster DNS: without it the pods cannot resolve Postgres, the collector or the runner.
  dnsNamespaceLabel:
    kubernetes.io/metadata.name: kube-system
  dnsPodLabel:
    k8s-app: kube-dns
  # Namespaces that host Postgres (5432) and the OTLP collector (4318).
  dataPlaneNamespaceLabel:
    omnidesk.io/network: data-plane
  # HTTPS egress for model providers and channel APIs. NetworkPolicy cannot match
  # host names: list the providers' published CIDRs. Empty means no internet egress.
  httpsEgressCIDRs: []
