# Restricted Pod Security for the OmniDesk namespace. ServiceAccounts are owned
# by the Helm chart (templates/serviceaccount.yaml); defining them here too made
# `helm install` fail on ownership metadata after applying this file.
apiVersion: v1
kind: Namespace
metadata:
  name: omnidesk
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
