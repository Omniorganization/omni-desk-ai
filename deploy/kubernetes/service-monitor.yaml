apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: omnidesk-agent
  namespace: omnidesk
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: omnidesk-agent
  endpoints:
    - port: http
      path: /admin/metrics
      interval: 30s
      # /admin/metrics requires an AdminAuth viewer token (external-secret-metrics.yaml);
      # without it every scrape is a 403.
      authorization:
        type: Bearer
        credentials:
          name: omnidesk-metrics-viewer
          key: token
