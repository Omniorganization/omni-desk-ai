# Namespace-wide default deny. The Helm chart's NetworkPolicies
# (helm/omnidesk/templates/networkpolicy.yaml) then allow exactly: ingress to
# the gateway from ingress-nginx and Prometheus; egress to cluster DNS, the
# dedicated sandbox runner hosts, Postgres/OTLP in data-plane namespaces and
# owner-approved HTTPS CIDRs; and DNS + Postgres for the migration hook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnidesk-default-deny
  namespace: omnidesk
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
