# Viewer-scoped token for the Prometheus ServiceMonitor (service-monitor.yaml);
# the same remote value as OMNIDESK_VIEWER_TOKEN in external-secret.yaml, nothing broader.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: omnidesk-metrics-viewer
  namespace: omnidesk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-secret-store
    kind: ClusterSecretStore
  target:
    name: omnidesk-metrics-viewer
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: omnidesk/production/metrics-viewer-token
