# Every secret the production validator requires at boot
# (omnidesk_agent/validation/production.py) for the chart's configmap.
# .github/workflows/kubernetes-ready.yml renders the chart and fails if this
# list and the validator disagree, so a missing key cannot ship again.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: omnidesk-secrets
  namespace: omnidesk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-secret-store
    kind: ClusterSecretStore
  target:
    name: omnidesk-secrets
    creationPolicy: Owner
  data:
    - secretKey: OMNIDESK_ADMIN_TOKEN
      remoteRef:
        key: omnidesk/production/admin-token
    - secretKey: OMNIDESK_VIEWER_TOKEN
      remoteRef:
        key: omnidesk/production/metrics-viewer-token
    - secretKey: OMNIDESK_GATEWAY_SECRET
      remoteRef:
        key: omnidesk/production/gateway-secret
    - secretKey: OMNIDESK_APPSYNC_SECRET_PEPPER
      remoteRef:
        key: omnidesk/production/appsync-secret-pepper
    - secretKey: OMNIDESK_SANDBOX_RUNNER_TOKEN
      remoteRef:
        key: omnidesk/production/sandbox-token
    - secretKey: OMNIDESK_SANDBOX_RUNNER_HMAC_SECRET
      remoteRef:
        key: omnidesk/production/sandbox-hmac
    - secretKey: OMNIDESK_POSTGRES_DSN
      remoteRef:
        key: omnidesk/production/postgres-dsn
    - secretKey: OMNIDESK_APPSYNC_POSTGRES_DSN
      remoteRef:
        key: omnidesk/production/appsync-postgres-dsn
    - secretKey: OMNIDESK_MEMORY_ENCRYPTION_KEY
      remoteRef:
        key: omnidesk/production/memory-encryption-key
    - secretKey: OMNIDESK_PLUGIN_SIGNING_SECRET
      remoteRef:
        key: omnidesk/production/plugin-signing-secret
    - secretKey: OMNIDESK_AUDIT_CHECKPOINT_HMAC_KEY
      remoteRef:
        key: omnidesk/production/audit-checkpoint-hmac-key
