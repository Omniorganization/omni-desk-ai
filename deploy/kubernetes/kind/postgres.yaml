# CI-only Postgres in a data-plane namespace (the chart's NetworkPolicy allows
# 5432 only to namespaces labelled omnidesk.io/network=data-plane).
apiVersion: v1
kind: Namespace
metadata:
  name: omnidesk-data
  labels:
    omnidesk.io/network: data-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: omnidesk-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: POSTGRES_IMAGE_PLACEHOLDER
          env:
            - name: POSTGRES_DB
              value: omnidesk
            - name: POSTGRES_USER
              value: omnidesk
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "omnidesk", "-d", "omnidesk"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: omnidesk-data
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
