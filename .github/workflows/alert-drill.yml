name: Alert Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  alert-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python scripts/check_observability_contract.py .
      - run: python scripts/check_alert_rules_fire.py deploy/observability/prometheus-rules.yml | tee alert-drill-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: alert-drill-report
          path: alert-drill-report.json
