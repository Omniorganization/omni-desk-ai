name: Budget Infrastructure Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/hetzner-budget/**
      - .github/workflows/budget-infrastructure-check.yml
  push:
    branches: [main]
    paths:
      - deploy/hetzner-budget/**
      - .github/workflows/budget-infrastructure-check.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/hetzner-budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - name: Exercise budget and network guards without a cloud account
        run: terraform test -no-color
# This workflow has no cloud token, secret access, apply or resource mutation.
