name: Isolated Cloud Acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/isolated-cloud-acceptance.yml'
      - 'scripts/isolated_cloud_acceptance.py'
      - 'omnidesk_agent/sandbox/**'
      - 'tests/test_sandbox_runner.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ACCEPTANCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      OMNIDESK_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install locked dependencies and rootless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns
          python -m pip install --require-hashes -r requirements.dev.lock
          python -m pip install --require-hashes -r requirements.enterprise.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Actual private HTTPS, persistence, restore and sandbox verification
        run: python scripts/isolated_cloud_acceptance.py --output reports/isolated-cloud
      - name: Sandbox regression tests
        run: pytest -q tests/test_sandbox_runner.py tests/test_sandbox_docker_command.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isolated-cloud-acceptance
          path: reports/isolated-cloud/
          if-no-files-found: error
