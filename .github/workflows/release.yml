name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "candidate permits external-evidence audit; real-ga requires fail-closed evidence"
        type: choice
        required: true
        default: candidate
        options:
          - candidate
          - real-ga
      external_evidence_run_id:
        description: "Enforced Main Verification run id that uploaded the complete bound external evidence artifact"
        required: false
        default: ""
      external_evidence_artifact_name:
        description: "Bound external evidence artifact name from Main Verification"
        required: false
        default: external-ga-evidence-bound

permissions:
  contents: read

env:
  EXPECTED_VERSION: 1.12.7+root-monorepo-production-ga-candidate
  RELEASE_CHANNEL: ${{ inputs.release_channel || 'candidate' }}

jobs:
  web-admin-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: apps/web-admin-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build and export Web Admin OCI image
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-web-admin/payload"
          docker pull node:22-bookworm-slim
          NODE_BASE_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-bookworm-slim)"
          test -n "$NODE_BASE_IMAGE"
          docker build --build-arg "NODE_BASE_IMAGE=$NODE_BASE_IMAGE" -f apps/web-admin-next/Dockerfile -t omnidesk-web-admin:${{ github.sha }} apps/web-admin-next
          docker save omnidesk-web-admin:${{ github.sha }} | gzip -9 > "$RUNNER_TEMP/release-web-admin/payload/omnidesk-web-admin-${{ github.sha }}.tar.gz"
          python scripts/write_native_artifact_manifest.py \
            --platform web-admin \
            --artifact-root "$RUNNER_TEMP/release-web-admin/payload" \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-web-admin/native-artifact-manifest.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-web-admin
          path: ${{ runner.temp }}/release-web-admin
          if-no-files-found: error

  desktop-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: desktop-linux
          - os: macos-latest
            artifact: desktop-macos
          - os: windows-latest
            artifact: desktop-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"
          components: clippy
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: apps/desktop-tauri
      - run: npm run typecheck
        working-directory: apps/desktop-tauri
      - run: npm test
        working-directory: apps/desktop-tauri
      - run: cargo test --locked --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml -- -D warnings
      - run: npm run tauri:build
        working-directory: apps/desktop-tauri
      - name: Collect digest-bound Tauri bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/desktop-tauri/src-tauri/target/release/bundle"
          test -d "$bundle_root"
          test -n "$(find "$bundle_root" -type f -print -quit)"
          mkdir -p "$RUNNER_TEMP/release-${{ matrix.artifact }}/payload"
          (cd "$bundle_root" && tar -cf - .) | (cd "$RUNNER_TEMP/release-${{ matrix.artifact }}/payload" && tar -xf -)
          python scripts/write_native_artifact_manifest.py \
            --platform "${{ matrix.artifact }}" \
            --artifact-root "$RUNNER_TEMP/release-${{ matrix.artifact }}/payload" \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-${{ matrix.artifact }}/native-artifact-manifest.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-${{ matrix.artifact }}
          if-no-files-found: error

  mobile-android-release:
    # The Android upload key lives only in the protected release environment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.8"
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - name: Prepare Android release SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=$?
          set -o pipefail
          test "$license_status" -eq 0
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
      - name: Restore Android release signing key
        env:
          OMNI_ANDROID_KEYSTORE_BASE64: ${{ secrets.OMNI_ANDROID_KEYSTORE_BASE64 }}
          OMNI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OMNI_ANDROID_KEYSTORE_PASSWORD }}
          OMNI_ANDROID_KEY_ALIAS: ${{ secrets.OMNI_ANDROID_KEY_ALIAS }}
          OMNI_ANDROID_KEY_PASSWORD: ${{ secrets.OMNI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OMNI_ANDROID_KEYSTORE_BASE64"
          test -n "$OMNI_ANDROID_KEYSTORE_PASSWORD"
          test -n "$OMNI_ANDROID_KEY_ALIAS"
          test -n "$OMNI_ANDROID_KEY_PASSWORD"
          printf '%s' "$OMNI_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omnidesk-release.keystore"
          {
            echo "OMNI_ANDROID_KEYSTORE=$RUNNER_TEMP/omnidesk-release.keystore"
            echo "OMNI_ANDROID_KEYSTORE_PASSWORD=$OMNI_ANDROID_KEYSTORE_PASSWORD"
            echo "OMNI_ANDROID_KEY_ALIAS=$OMNI_ANDROID_KEY_ALIAS"
            echo "OMNI_ANDROID_KEY_PASSWORD=$OMNI_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Restore Android Firebase config
        env:
          OMNI_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.OMNI_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$OMNI_ANDROID_GOOGLE_SERVICES_JSON"
          printf '%s' "$OMNI_ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: flutter build appbundle --release
        timeout-minutes: 20
      - name: Verify and collect signed Android App Bundle
        working-directory: .
        run: |
          set -euo pipefail
          aab="$(find apps/mobile-flutter/build/app/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$aab"
          jarsigner -verify -verbose -certs "$aab"
          mkdir -p "$RUNNER_TEMP/release-mobile-android/payload"
          cp "$aab" "$RUNNER_TEMP/release-mobile-android/payload/"
          python scripts/write_native_artifact_manifest.py \
            --platform mobile-android \
            --artifact-root "$RUNNER_TEMP/release-mobile-android/payload" \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-mobile-android/native-artifact-manifest.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-mobile-android
          path: ${{ runner.temp }}/release-mobile-android
          if-no-files-found: error

  mobile-ios-release:
    # The iOS distribution certificate lives only in the protected release environment.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.8"
          cache: true
      - run: flutter pub get
      - run: cd ios && pod install
      - name: Restore iOS distribution signing material
        env:
          OMNI_IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.OMNI_IOS_DISTRIBUTION_CERT_BASE64 }}
          OMNI_IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.OMNI_IOS_DISTRIBUTION_CERT_PASSWORD }}
          OMNI_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.OMNI_IOS_PROVISIONING_PROFILE_BASE64 }}
          OMNI_IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.OMNI_IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          OMNI_IOS_KEYCHAIN_PASSWORD: ${{ secrets.OMNI_IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "real-ga" ]]; then
            test -n "$OMNI_IOS_DISTRIBUTION_CERT_BASE64"
            test -n "$OMNI_IOS_DISTRIBUTION_CERT_PASSWORD"
            test -n "$OMNI_IOS_PROVISIONING_PROFILE_BASE64"
            test -n "$OMNI_IOS_EXPORT_OPTIONS_PLIST_BASE64"
            test -n "$OMNI_IOS_KEYCHAIN_PASSWORD"
          fi
          if [[ -n "${OMNI_IOS_DISTRIBUTION_CERT_BASE64:-}" ]]; then
            python - <<'PY'
          import base64
          import os
          from pathlib import Path
          for env_name, target in (
              ("OMNI_IOS_DISTRIBUTION_CERT_BASE64", Path(os.environ["RUNNER_TEMP"]) / "distribution.p12"),
              ("OMNI_IOS_PROVISIONING_PROFILE_BASE64", Path(os.environ["RUNNER_TEMP"]) / "omnidesk.mobileprovision"),
              ("OMNI_IOS_EXPORT_OPTIONS_PLIST_BASE64", Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"),
          ):
              target.write_bytes(base64.b64decode(os.environ[env_name]))
          PY
            keychain="$RUNNER_TEMP/omnidesk.keychain-db"
            security create-keychain -p "$OMNI_IOS_KEYCHAIN_PASSWORD" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$OMNI_IOS_KEYCHAIN_PASSWORD" "$keychain"
            security default-keychain -s "$keychain"
            security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$OMNI_IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$OMNI_IOS_KEYCHAIN_PASSWORD" "$keychain"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$RUNNER_TEMP/omnidesk.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/omnidesk.mobileprovision"
            security find-identity -v -p codesigning "$keychain"
            echo "OMNI_IOS_SIGNED_BUILD=1" >> "$GITHUB_ENV"
          else
            echo "OMNI_IOS_SIGNED_BUILD=0" >> "$GITHUB_ENV"
          fi
      - name: Build signed IPA or candidate no-codesign app
        run: |
          set -euo pipefail
          if [[ "$OMNI_IOS_SIGNED_BUILD" == "1" ]]; then
            flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
            ipa="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
            test -n "$ipa"
            rm -rf "$RUNNER_TEMP/ipa-verify"
            mkdir -p "$RUNNER_TEMP/ipa-verify"
            unzip -q "$ipa" -d "$RUNNER_TEMP/ipa-verify"
            app="$(find "$RUNNER_TEMP/ipa-verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          else
            flutter build ios --release --no-codesign
          fi
      - name: Collect digest-bound iOS payload
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-mobile-ios/payload"
          if [[ "$OMNI_IOS_SIGNED_BUILD" == "1" ]]; then
            ipa="$(find apps/mobile-flutter/build/ios/ipa -type f -name '*.ipa' -print -quit)"
            cp "$ipa" "$RUNNER_TEMP/release-mobile-ios/payload/"
          else
            ditto -c -k --sequesterRsrc --keepParent \
              apps/mobile-flutter/build/ios/iphoneos/Runner.app \
              "$RUNNER_TEMP/release-mobile-ios/payload/Runner-candidate-nosign.zip"
          fi
          python scripts/write_native_artifact_manifest.py \
            --platform mobile-ios \
            --artifact-root "$RUNNER_TEMP/release-mobile-ios/payload" \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-mobile-ios/native-artifact-manifest.json"
      - name: Remove temporary iOS signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/omnidesk.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/omnidesk.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/omnidesk.mobileprovision"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-mobile-ios
          path: ${{ runner.temp }}/release-mobile-ios
          if-no-files-found: error

  build:
    needs:
      - web-admin-release
      - desktop-release
      - mobile-android-release
      - mobile-ios-release
    # Signing, GHCR publishing and attestation only run from main, in the protected
    # release environment that holds the signing secrets. Verifiers pin the Sigstore
    # signer identity and the attestation source ref to release.yml@refs/heads/main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    env:
      OMNIDESK_REQUIRE_ED25519_RELEASE_SIGNATURES: "1"
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Download all native application release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: ${{ runner.temp }}/tri-app-native-input
          merge-multiple: false
      - name: Run tri-app release configuration preflight scopes
        # Preflight and evidence reports go to reports/release/, never dist/:
        # build_release.sh starts with rm -rf dist, and dist/ is the signed payload.
        run: |
          python scripts/check_release_configuration.py --scope web-admin --format json --report-path reports/release/web-admin-preflight.json
          python scripts/check_release_configuration.py --scope desktop --format json --report-path reports/release/desktop-preflight.json
          python scripts/check_release_configuration.py --scope mobile --format json --report-path reports/release/mobile-preflight.json
          python scripts/check_release_configuration.py --scope tri-app --format json --report-path reports/release/tri-app-preflight.json
      - name: Download complete external evidence artifact
        if: ${{ inputs.external_evidence_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL_EVIDENCE_RUN_ID: ${{ inputs.external_evidence_run_id }}
          EXTERNAL_EVIDENCE_ARTIFACT_NAME: ${{ inputs.external_evidence_artifact_name }}
        run: |
          set -euo pipefail
          [[ "$EXTERNAL_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid run id"; exit 1; }
          # Accepts only the bound artifact of a successful Main Verification run for this
          # exact main commit (release/evidence-source-workflows.json) and copies only the
          # expected evidence files; pytest and the signing steps below run in this workspace.
          python scripts/fetch_ci_evidence_artifact.py \
            --consumer release \
            --run-id "$EXTERNAL_EVIDENCE_RUN_ID" \
            --artifact-name "$EXTERNAL_EVIDENCE_ARTIFACT_NAME" \
            --dest release/external-evidence \
            --write-report "$RUNNER_TEMP/external-evidence-fetch-report.json"
      - name: Import complete external GA evidence raw directory
        env:
          EXTERNAL_GA_EVIDENCE_RAW_DIR: ${{ vars.EXTERNAL_GA_EVIDENCE_RAW_DIR }}
          EXTERNAL_GA_EVIDENCE_EXPECTED_VERSION: 1.12.7+root-monorepo-production-ga-candidate
        run: |
          set -euo pipefail
          if [[ -n "${EXTERNAL_GA_EVIDENCE_RAW_DIR:-}" ]]; then
            python scripts/check_release_configuration.py \
              --scope external-ga-evidence \
              --format json \
              --report-path reports/release/external-ga-evidence-preflight.json
            python scripts/import_external_ga_evidence.py \
              --raw-dir "$EXTERNAL_GA_EVIDENCE_RAW_DIR" \
              --expected-version "$EXTERNAL_GA_EVIDENCE_EXPECTED_VERSION" \
              --copy \
              --write-report release/external-ga-evidence-import-report.json
          else
            python -c 'import json; from pathlib import Path; Path("reports/release").mkdir(parents=True, exist_ok=True); Path("release").mkdir(exist_ok=True); payload={"status":"skipped","reason":"EXTERNAL_GA_EVIDENCE_RAW_DIR is not set; use external_evidence_run_id or specialized importers"}; Path("reports/release/external-ga-evidence-preflight.json").write_text(json.dumps(payload, indent=2)+"\n", encoding="utf-8"); Path("release/external-ga-evidence-import-report.json").write_text(json.dumps(payload, indent=2)+"\n", encoding="utf-8")'
          fi
      - name: Import iOS real-device evidence
        env:
          IOS_EVIDENCE_RAW_DIR: ${{ vars.IOS_EVIDENCE_RAW_DIR }}
          IOS_EVIDENCE_EXPECTED_VERSION: 1.12.7+root-monorepo-production-ga-candidate
        run: |
          set -euo pipefail
          if [[ -n "${IOS_EVIDENCE_RAW_DIR:-}" ]]; then
            python scripts/check_release_configuration.py --scope ios-evidence --format json --report-path reports/release/ios-evidence-preflight.json
            python scripts/import_ios_real_device_evidence.py \
              --raw-dir "$IOS_EVIDENCE_RAW_DIR" \
              --expected-version "$IOS_EVIDENCE_EXPECTED_VERSION" \
              --copy \
              --write-report release/ios-real-device-evidence-import-report.json
          else
            python -c 'import json; from pathlib import Path; Path("reports/release").mkdir(parents=True, exist_ok=True); Path("release").mkdir(exist_ok=True); payload={"status":"skipped","reason":"IOS_EVIDENCE_RAW_DIR is not set"}; Path("reports/release/ios-evidence-preflight.json").write_text(json.dumps(payload, indent=2)+"\n", encoding="utf-8"); Path("release/ios-real-device-evidence-import-report.json").write_text(json.dumps(payload, indent=2)+"\n", encoding="utf-8")'
          fi
      - name: Import tri-app live smoke evidence
        env:
          TRI_APP_ADMIN_TOKEN: ${{ secrets.TRI_APP_ADMIN_TOKEN }}
          TRI_APP_MOBILE_APPROVAL_TOKEN: ${{ secrets.TRI_APP_MOBILE_APPROVAL_TOKEN }}
          TRI_APP_DESKTOP_AGENT_TOKEN: ${{ secrets.TRI_APP_DESKTOP_AGENT_TOKEN }}
          TRI_APP_AUDIT_HMAC_SECRET: ${{ secrets.TRI_APP_AUDIT_HMAC_SECRET }}
          TRI_APP_BACKEND_BASE_URL: ${{ vars.TRI_APP_BACKEND_BASE_URL }}
          TRI_APP_WEB_ADMIN_BASE_URL: ${{ vars.TRI_APP_WEB_ADMIN_BASE_URL }}
          TRI_APP_MOBILE_CALLBACK_URL: ${{ vars.TRI_APP_MOBILE_CALLBACK_URL }}
          TRI_APP_DESKTOP_AGENT_URL: ${{ vars.TRI_APP_DESKTOP_AGENT_URL }}
          TRI_APP_ORG_ID: ${{ vars.TRI_APP_ORG_ID }}
          TRI_APP_LIVE_SMOKE_SCENARIO_ID: ${{ vars.TRI_APP_LIVE_SMOKE_SCENARIO_ID }}
          TRI_APP_LIVE_SMOKE_REPORT_PATH: ${{ vars.TRI_APP_LIVE_SMOKE_REPORT_PATH }}
        run: |
          set -euo pipefail
          if [[ -n "${TRI_APP_LIVE_SMOKE_REPORT_PATH:-}" ]]; then
            python scripts/check_release_configuration.py --scope tri-app-live-smoke --format json --report-path reports/release/tri-app-live-smoke-preflight.json
            python scripts/import_tri_app_live_smoke_evidence.py \
              --report "$TRI_APP_LIVE_SMOKE_REPORT_PATH" \
              --expected-org-id "$TRI_APP_ORG_ID" \
              --expected-scenario-id "$TRI_APP_LIVE_SMOKE_SCENARIO_ID" \
              --copy \
              --write-report release/tri-app-live-smoke-evidence-import-report.json
          else
            python -c 'import json; from pathlib import Path; Path("reports/release").mkdir(parents=True, exist_ok=True); Path("release").mkdir(exist_ok=True); payload={"status":"skipped","reason":"TRI_APP_LIVE_SMOKE_REPORT_PATH is not set"}; Path("reports/release/tri-app-live-smoke-preflight.json").write_text(json.dumps(payload, indent=2)+"\n", encoding="utf-8"); Path("release/tri-app-live-smoke-evidence-import-report.json").write_text(json.dumps(payload, indent=2)+"\n", encoding="utf-8")'
          fi
      - run: python scripts/check_workflow_governance.py . --require-real-workflows
      - run: python scripts/check_team_governance_contract.py .
      - run: PYTHONPATH=. python -m pytest -q -W error --timeout=60 --timeout-method=thread
      - run: |
          python scripts/check_lock_hashes.py requirements.lock
          python scripts/check_lock_hashes.py requirements.runtime.lock
          python scripts/check_lock_hashes.py requirements.bootstrap.lock
          python scripts/check_lock_hashes.py requirements.dev.lock
          python scripts/check_lock_hashes.py requirements.security.lock
          python scripts/check_lock_hashes.py requirements.enterprise.lock
      - run: python scripts/check_production_install_policy.py .
      - run: python scripts/check_ga_release_gate.py .
      - name: Verify live branch and team governance before Real GA
        env:
          TEAM_GOVERNANCE_TOKEN: ${{ secrets.OMNIDESK_GITHUB_GOVERNANCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          audit_args=()
          if [[ "$RELEASE_CHANNEL" == "candidate" ]]; then
            audit_args+=(--audit-only)
          fi
          mkdir -p release/external-evidence/control-plane
          python scripts/check_live_branch_protection_contract.py . \
            --repository "$GITHUB_REPOSITORY" \
            --token-env TEAM_GOVERNANCE_TOKEN \
            --write-report release/external-evidence/control-plane/github-branch-protection-live.json \
            "${audit_args[@]}"
          python scripts/check_github_team_governance_live.py . \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --branch-protection-report release/external-evidence/control-plane/github-branch-protection-live.json \
            --write-report release/external-evidence/control-plane/github-team-governance-live.json \
            "${audit_args[@]}"
      - name: Bind current Release-built native files to enforced Main Verification evidence
        env:
          EXTERNAL_EVIDENCE_RUN_ID: ${{ inputs.external_evidence_run_id }}
        run: |
          set -euo pipefail
          [[ -z "$EXTERNAL_EVIDENCE_RUN_ID" || "$EXTERNAL_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid run id"; exit 1; }
          audit_args=()
          if [[ "$RELEASE_CHANNEL" == "candidate" ]]; then
            audit_args+=(--audit-only)
          fi
          python scripts/check_current_release_artifact_binding.py \
            --artifact-root "$RUNNER_TEMP/tri-app-native-input" \
            --evidence-root release/external-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --release-run-id "$GITHUB_RUN_ID" \
            --main-verification-run-id "$EXTERNAL_EVIDENCE_RUN_ID" \
            --write-report reports/release/current-release-artifact-binding.json \
            "${audit_args[@]}"
      - name: Run complete Real GA evidence and final Customer GA gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTERNAL_EVIDENCE_RUN_ID: ${{ inputs.external_evidence_run_id }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "real-ga" ]]; then
            test -n "$EXTERNAL_EVIDENCE_RUN_ID" || { echo "real-ga release requires an enforced Main Verification evidence run id" >&2; exit 64; }
            python scripts/check_real_ga_complete.py . --write-report release/real-ga-evidence-audit-1.12.7.json
            python scripts/check_customer_distribution_ga.py . \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" \
              --current-release-binding-report reports/release/current-release-artifact-binding.json \
              --write-live-report reports/release/main-verification-live-artifact.json \
              --write-report release/real-ga-evidence-audit-1.12.7.json
          elif [[ "$RELEASE_CHANNEL" == "candidate" ]]; then
            python scripts/check_real_ga_complete.py . --audit-only --write-report release/real-ga-evidence-audit-1.12.7.json
            python scripts/check_customer_distribution_ga.py . \
              --audit-only \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" \
              --current-release-binding-report reports/release/current-release-artifact-binding.json \
              --write-live-report reports/release/main-verification-live-artifact.json \
              --write-report release/real-ga-evidence-audit-1.12.7.json
          else
            echo "release_channel must be candidate or real-ga" >&2
            exit 64
          fi
          cp release/real-ga-evidence-audit-1.12.7.json reports/release/external-ga-evidence-audit.json
          python scripts/write_real_ga_evidence_summary.py . \
            --audit-report release/real-ga-evidence-audit-1.12.7.json \
            --output release/real-ga-evidence-summary-1.12.7.json \
            --source-commit "$GITHUB_SHA"
          cp release/real-ga-evidence-summary-1.12.7.json reports/release/external-ga-evidence-summary.json

      - name: Check every Real GA evidence import report was written
        # if-no-files-found on the upload below only fails when none of its files
        # exist, so check each one before anything is published.
        run: |
          set -euo pipefail
          for report in \
            release/real-ga-evidence-audit-1.12.7.json \
            release/real-ga-evidence-summary-1.12.7.json \
            release/external-ga-evidence-import-report.json \
            release/ios-real-device-evidence-import-report.json \
            release/tri-app-live-smoke-evidence-import-report.json \
            release/external-evidence/control-plane/github-branch-protection-live.json \
            release/external-evidence/control-plane/github-team-governance-live.json \
            reports/release/web-admin-preflight.json \
            reports/release/desktop-preflight.json \
            reports/release/mobile-preflight.json \
            reports/release/tri-app-preflight.json \
            reports/release/external-ga-evidence-preflight.json \
            reports/release/ios-evidence-preflight.json \
            reports/release/tri-app-live-smoke-preflight.json \
            reports/release/current-release-artifact-binding.json \
            reports/release/main-verification-live-artifact.json \
            reports/release/external-ga-evidence-audit.json \
            reports/release/external-ga-evidence-summary.json; do
            test -s "$report" || { echo "missing Real GA evidence import report: $report" >&2; exit 1; }
          done

      - name: Verify release channel policy after external evidence gate
        run: |
          python scripts/check_release_channel_policy.py . \
            --release-channel "$RELEASE_CHANNEL" \
            --package-version "$EXPECTED_VERSION" \
            --package-slug "$EXPECTED_VERSION"

      - name: Build and push release image, then capture registry digest
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${repo_lc}/omnidesk-agent:${GITHUB_SHA}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --build-arg OMNIDESK_VERSION="$EXPECTED_VERSION" \
            --build-arg OMNIDESK_BUILD_SHA="$GITHUB_SHA" \
            --build-arg OMNIDESK_ARTIFACT_SHA256="set-by-release-metadata" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image_ref" .
          docker push "$image_ref"
          digest="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry did not return a valid image digest for $image_ref: $digest" >&2
            exit 65
          fi
          echo "OMNIDESK_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "OMNIDESK_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Release image: $image_ref@$digest"

      - name: Build release wheel, SBOM and metadata
        run: bash scripts/build_release.sh
        env:
          # Signed below, once every file that ships in dist/ exists.
          OMNIDESK_RELEASE_DEFER_SIGNING: "1"
          OMNIDESK_IMAGE_REF: ${{ env.OMNIDESK_IMAGE_REF }}
          OMNIDESK_IMAGE_DIGEST: ${{ env.OMNIDESK_IMAGE_DIGEST }}

      - name: Bind all native application artifacts into the release payload
        run: |
          set -euo pipefail
          native_root="$RUNNER_TEMP/tri-app-native-input"
          test -d "$native_root"
          manifest_count="$(find "$native_root" -type f -name native-artifact-manifest.json | wc -l | tr -d ' ')"
          test "$manifest_count" -eq 6
          python scripts/write_native_artifact_manifest.py \
            --platform tri-app-release \
            --artifact-root "$native_root" \
            --source-commit "$GITHUB_SHA" \
            --output dist/tri-app-native-artifacts.json
          tar -czf dist/tri-app-native-artifacts.tar.gz -C "$native_root" .

      - name: Render locked Helm production values
        env:
          OMNIDESK_SANDBOX_RUNNER_DIGEST: ${{ vars.OMNIDESK_SANDBOX_RUNNER_DIGEST }}
        run: |
          set -euo pipefail
          if [[ ! "${OMNIDESK_SANDBOX_RUNNER_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Set vars.OMNIDESK_SANDBOX_RUNNER_DIGEST to the final sandbox-runner OCI digest" >&2
            exit 66
          fi
          python scripts/render_locked_helm_values.py \
            --app-digest "$OMNIDESK_IMAGE_DIGEST" \
            --sandbox-runner-digest "$OMNIDESK_SANDBOX_RUNNER_DIGEST" \
            --output dist/values.production.locked.yaml
          python scripts/check_kubernetes_contract.py . --locked-values dist/values.production.locked.yaml

      - name: Write SLSA provenance for the release payload
        run: python scripts/write_slsa_provenance.py dist --builder-id "$GITHUB_WORKFLOW@$GITHUB_RUN_ID" --source-ref "$GITHUB_REF" --image-ref "$OMNIDESK_IMAGE_REF" --image-digest "$OMNIDESK_IMAGE_DIGEST"

      - name: Install Cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
      - name: Cosign keyless sign release container image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          test -n "$OMNIDESK_IMAGE_REF"
          test -n "$OMNIDESK_IMAGE_DIGEST"
          cosign sign --yes "$OMNIDESK_IMAGE_REF@$OMNIDESK_IMAGE_DIGEST"
          cosign attest --yes --predicate dist/sbom.json --type spdx "$OMNIDESK_IMAGE_REF@$OMNIDESK_IMAGE_DIGEST"
          cosign attest --yes --predicate dist/slsa-provenance.json --type slsaprovenance "$OMNIDESK_IMAGE_REF@$OMNIDESK_IMAGE_DIGEST"

      - name: Cosign keyless sign complete release payload artifact set
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          python scripts/list_cosign_artifacts.py dist --null | while IFS= read -r -d '' artifact; do
            cosign sign-blob --yes "$artifact" --output-signature "$artifact.cosign.sig" --output-certificate "$artifact.cosign.pem"
          done
      - name: Cosign attest SBOM and SLSA provenance
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          cosign attest-blob --yes --predicate dist/sbom.json --type spdx "$wheel" --output-signature dist/sbom.intoto.sig --output-certificate dist/sbom.intoto.pem
          cosign attest-blob --yes --predicate dist/slsa-provenance.json --type slsaprovenance "$wheel" --output-signature dist/slsa.intoto.sig --output-certificate dist/slsa.intoto.pem

      - name: Sign and verify the complete release payload with Ed25519
        # Last write to dist/: checksums.txt and the Ed25519 signatures cover every
        # file above, Cosign certificates included, so --require-signatures holds for
        # the published artifact. Only this step sees the private key.
        env:
          OMNIDESK_RELEASE_SIGNING_ED25519_KEY: ${{ secrets.OMNIDESK_RELEASE_SIGNING_ED25519_KEY }}
        run: |
          set -euo pipefail
          test -f release/release-signing-public-key.pem || { echo "commit release/release-signing-public-key.pem (scripts/generate_release_signing_key.py) before releasing" >&2; exit 1; }
          python scripts/finalize_release_payload.py dist --expected-version "$EXPECTED_VERSION" --expected-image-digest "$OMNIDESK_IMAGE_DIGEST"

      - run: python scripts/verify_release_artifact.py dist --expected-version "$EXPECTED_VERSION" --require-signatures --require-metadata --expected-image-digest "$OMNIDESK_IMAGE_DIGEST"

      - name: List release payload for GitHub artifact attestation
        run: |
          set -euo pipefail
          test -f dist/release_metadata.json
          test -f dist/release_signatures.json
          # Attest every top-level file after the Ed25519 signing step: promotion,
          # staging and rollback verify an attestation for each one
          # (find dist -maxdepth 1 -type f). The list lives outside dist/.
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/attestation-subjects.sha256"
          test -s "$RUNNER_TEMP/attestation-subjects.sha256"
      - name: Generate artifact attestations
        # gh has no subcommand that creates attestations; GitHub's action creates the
        # Sigstore-signed provenance that `gh attestation verify` checks.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attestation-subjects.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-and-sbom
          path: dist/**
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: real-ga-evidence-import-reports
          if-no-files-found: error
          path: |
            release/real-ga-evidence-audit-1.12.7.json
            release/real-ga-evidence-summary-1.12.7.json
            release/external-ga-evidence-import-report.json
            release/ios-real-device-evidence-import-report.json
            release/tri-app-live-smoke-evidence-import-report.json
            release/external-evidence/control-plane/github-branch-protection-live.json
            release/external-evidence/control-plane/github-team-governance-live.json
            reports/release/web-admin-preflight.json
            reports/release/desktop-preflight.json
            reports/release/mobile-preflight.json
            reports/release/tri-app-preflight.json
            reports/release/external-ga-evidence-preflight.json
            reports/release/ios-evidence-preflight.json
            reports/release/tri-app-live-smoke-preflight.json
            reports/release/current-release-artifact-binding.json
            reports/release/main-verification-live-artifact.json
            reports/release/external-ga-evidence-audit.json
            reports/release/external-ga-evidence-summary.json
