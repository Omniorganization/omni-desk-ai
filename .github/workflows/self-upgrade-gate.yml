name: Self Upgrade Gate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "omnidesk_agent/self_upgrade/**"
      - "omnidesk_agent/self_learning/**"
      - "omnidesk_agent/self_healing/**"
      - "omnidesk_agent/learning/**"
      - "omnidesk_agent/security/**"
      - "omnidesk_agent/plugins/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: PYTHONPATH=. python -m pytest tests/test_upgrade_gate.py tests/test_upgrade_missing_tests_fail_closed.py tests/test_permission_diff_checker.py tests/test_admin_auth.py tests/test_permission_session_scope.py -q
      - name: Self-upgrade, self-learning and self-healing suites
        run: |
          shopt -s nullglob
          PYTHONPATH=. python -m pytest -q -W error tests/test_self_upgrade_*.py tests/test_upgrade_*.py tests/test_learning_*.py tests/test_self_healing_*.py tests/test_controlled_self_learning.py tests/test_daily_learning_pipeline.py tests/test_governance_evaluation_writeback.py tests/test_shadow_canary_upgrade_memory.py
