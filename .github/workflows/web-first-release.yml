name: Web First Protected Release
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Web First Candidate run on the current reviewed main
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: web-first-protected-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Require successful main candidate on exact checkout
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p reports/web-first
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate-run.json').read_text())
          expected = {'head_sha': os.environ['GITHUB_SHA'], 'head_branch': 'main',
                      'status': 'completed', 'conclusion': 'success', 'path': '.github/workflows/web-first-candidate.yml'}
          if any(run.get(key) != value for key, value in expected.items()):
              raise SystemExit('Only a successful exact-main Web candidate is eligible')
          if run.get('event') not in ('push', 'workflow_dispatch'):
              raise SystemExit('Pull-request candidates cannot be promoted')
          PY
          gh run download "$CANDIDATE_RUN_ID" --name web-first-candidate --dir reports/web-first
          python scripts/web_first_release.py verify --directory reports/web-first --expected-sha "$GITHUB_SHA"
      - name: Attest exact scoped artifact digests with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            reports/web-first/web-candidate.json
            reports/web-first/web-image.tar.gz
            reports/web-first/runtime-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-first-protected-release
          path: reports/web-first/
          if-no-files-found: error
          retention-days: 1
