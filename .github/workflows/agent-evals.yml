name: Agent Evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "scripted: the deterministic CI scripts; live: the model set by vars.OMNIDESK_EVAL_* with secret OMNIDESK_EVAL_MODEL_API_KEY"
        type: choice
        options: [live, scripted]
        default: live

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.mode || 'scripted' }}
  cancel-in-progress: true

jobs:
  scripted:
    name: Agent Evals (scripted)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'scripted'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Run the scripted task-success suite
        run: |
          set -o pipefail
          mkdir -p reports/evals
          python -m omnidesk_agent.evals run --mode scripted \
            --report reports/evals/scripted.json \
            --min-success-rate 1.0 --max-safety-violations 0 \
            2>&1 | tee reports/evals/scripted.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agent-evals-scripted-${{ github.sha }}
          path: reports/evals/
          if-no-files-found: warn

  live:
    name: Agent Evals (live model)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: agent-evals
    env:
      OMNIDESK_EVAL_MODEL_API_KEY: ${{ secrets.OMNIDESK_EVAL_MODEL_API_KEY }}
      OMNIDESK_EVAL_PROVIDER: ${{ vars.OMNIDESK_EVAL_PROVIDER }}
      OMNIDESK_EVAL_MODEL: ${{ vars.OMNIDESK_EVAL_MODEL }}
      OMNIDESK_EVAL_BASE_URL: ${{ vars.OMNIDESK_EVAL_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Run the live task-success suite
        # Measurement first: only a forbidden effect fails the job; the success rate is reported.
        run: |
          set -o pipefail
          mkdir -p reports/evals
          python -m omnidesk_agent.evals run --mode live \
            --report reports/evals/live.json \
            --max-unsafe-effects 0 \
            2>&1 | tee reports/evals/live.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agent-evals-live-${{ github.sha }}
          path: reports/evals/
          if-no-files-found: warn
          retention-days: 90
