name: Agent Repair PR

# No path filter: a self-upgrade PR that only touches tests/ or docs/ is
# re-checked too. In the merge queue the job reports skipped (no head ref).
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  repair-policy:
    if: startsWith(github.head_ref, 'ai/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Repository agent rules must exist
        run: test -f AGENTS.md && test -f release/AGENTS.md && test -f omnidesk_agent/security/AGENTS.md
      - name: Version and GA gates
        run: |
          python scripts/check_version_consistency.py .
          python scripts/check_ga_release_gate.py .
      - name: External evidence audit remains fail-closed when missing
        run: python scripts/check_external_ga_evidence.py . --audit-only
      - name: Focused repair-loop tests
        run: python -m pytest tests/test_ga_1_11_openclaw_codex_alignment.py
      # The re-check uses the pipeline's policy from the base commit, never the
      # copy in the PR under review, and runs Python isolated (-I) so files the
      # PR adds cannot shadow the modules it imports.
      - name: Load the pipeline policy from the base commit
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/base-policy"
          if git cat-file -e "$BASE_SHA:omnidesk_agent/self_upgrade/pipeline/diff_policy.py" 2>/dev/null; then
            git show "$BASE_SHA:omnidesk_agent/self_upgrade/pipeline/diff_policy.py" > "$RUNNER_TEMP/base-policy/diff_policy.py"
            git show "$BASE_SHA:omnidesk_agent/self_upgrade/pipeline/publisher.py" > "$RUNNER_TEMP/base-policy/publisher.py"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "no pipeline at the base commit, so no PR can come from it"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Is this a PR the self-upgrade pipeline opened?
        id: origin
        if: steps.policy.outputs.present == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python -I - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("base_publisher", os.path.join(os.environ["RUNNER_TEMP"], "base-policy", "publisher.py"))
          base = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(base)
          pipeline = base.is_pipeline_branch(os.environ["HEAD_REF"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pipeline={str(pipeline).lower()}\n")
          print("pipeline branch: re-checking" if pipeline else "not a pipeline branch: normal review only")
          PY
      - name: Self-upgrade PRs stay inside the diff policy
        if: steps.origin.outputs.pipeline == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          python -I - <<'PY'
          import importlib.util, os
          from fnmatch import fnmatch
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("base_diff_policy", os.path.join(os.environ["RUNNER_TEMP"], "base-policy", "diff_policy.py"))
          base = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(base)
          changed = [p for p in Path(os.environ["RUNNER_TEMP"], "changed.txt").read_text().splitlines() if p]
          bad = [p for p in changed if any(fnmatch(p, pattern) for pattern in base.RESTRICTED_PATTERNS)]
          if bad:
              raise SystemExit(f"self-upgrade PR touches restricted paths: {bad}")
          print(f"{len(changed)} changed files, none restricted")
          PY
      - name: Re-run the tests the pipeline named, independently
        if: steps.origin.outputs.pipeline == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          match = re.search(r"^self-upgrade-targeted-tests: (\[.*\])$", os.environ.get("PR_BODY", ""), re.MULTILINE)
          tests = json.loads(match.group(1)) if match else []
          node = re.compile(r"^tests/[A-Za-z0-9_./-]+\.py(::[A-Za-z0-9_\[\]-]+)*$")
          if not tests or not all(isinstance(t, str) and node.match(t) for t in tests):
              raise SystemExit("PR body must list valid targeted tests")
          sys.exit(subprocess.call([sys.executable, "-m", "pytest", "-q", "-W", "error", *tests]))
          PY
