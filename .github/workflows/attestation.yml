name: Artifact Attestation

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Release workflow run id containing dist-and-sbom artifact
        required: true
      artifact_name:
        description: GitHub Actions artifact name
        required: true
        default: dist-and-sbom

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  attest:
    # Only sign artifacts when dispatched from the protected main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid run id"; exit 1; }
          mkdir -p dist
          gh run download "$ARTIFACT_RUN_ID" --name "$ARTIFACT_NAME" --dir dist
      - name: List artifacts to attest
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/attestation-subjects.sha256"
          test -s "$RUNNER_TEMP/attestation-subjects.sha256"
      - name: Generate GitHub artifact attestation
        # Note: production promotion only trusts attestations signed by
        # release.yml (--signer-workflow); this workflow is for re-attesting
        # artifacts outside the promotion path.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attestation-subjects.sha256
