name: Tri-App Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tri-app-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python scripts/check_lock_hashes.py requirements.bootstrap.lock
      - name: Prepare tri-app evidence directory
        run: mkdir -p "$RUNNER_TEMP/tri-app-backend-evidence"
      - name: Tri-app backend foundation tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -vv --tb=short tests/test_tri_app_foundation.py \
            2>&1 | tee "$RUNNER_TEMP/tri-app-backend-evidence/foundation.txt"
      - name: Tri-app source release readiness
        run: |
          set -o pipefail
          python scripts/check_tri_app_release_readiness.py . --mode source \
            2>&1 | tee "$RUNNER_TEMP/tri-app-backend-evidence/source-readiness.txt"
      - name: Typed client contract coverage
        run: |
          set -o pipefail
          python scripts/check_typed_client_contracts.py . \
            2>&1 | tee "$RUNNER_TEMP/tri-app-backend-evidence/typed-client-contracts.txt"
      - name: Web Admin proxy contract coverage
        run: |
          set -o pipefail
          python scripts/check_web_admin_proxy_contract.py . \
            2>&1 | tee "$RUNNER_TEMP/tri-app-backend-evidence/web-admin-proxy-contract.txt"
      - run: find . -type d \( -name "__pycache__" -o -name ".pytest_cache" \) -prune -exec rm -rf {} + && find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete
      - name: GA release gate
        run: |
          set -o pipefail
          python scripts/check_ga_release_gate.py . \
            2>&1 | tee "$RUNNER_TEMP/tri-app-backend-evidence/ga-release-gate.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tri-app-backend-${{ github.sha }}
          path: ${{ runner.temp }}/tri-app-backend-evidence/
          if-no-files-found: warn

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: apps/web-admin-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop-tauri-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - run: python ../../scripts/check_tri_app_release_readiness.py ../.. --mode desktop-release

  glib-backport-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.17.0"
      - name: Build real desktop assets for optimized native harness
        working-directory: apps/desktop-tauri
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Verify exact backport source and resolved Cargo graph
        run: |
          mkdir -p reports/glib-backport
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml > reports/glib-backport/metadata.json
          python scripts/check_glib_backport.py . --metadata reports/glib-backport/metadata.json --report reports/glib-backport/integrity.json
      - name: Observe authentic unpatched baseline in isolated cloud copy
        run: |
          baseline="$RUNNER_TEMP/glib-baseline"
          mkdir -p "$baseline"
          cp -a apps/desktop-tauri/src-tauri/. "$baseline/"
          cp -a apps/desktop-tauri/dist "$RUNNER_TEMP/dist"
          tar -xzf "$baseline/vendor/glib-0.18.5.crate" --strip-components=1 -C "$baseline/vendor/glib"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/glib-baseline-target"
          set +e
          cargo test --release --locked --manifest-path "$baseline/Cargo.toml" --test glib_variant_regression > reports/glib-backport/baseline.log 2>&1
          status=$?
          set -e
          echo "$status" > reports/glib-backport/baseline.status
          cat reports/glib-backport/baseline.log
          rm -rf "$RUNNER_TEMP/glib-baseline-target"
      - name: Enforce optimized patched iterator regression
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/glib-patched-target"
          set -o pipefail
          cargo test --release --locked --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --test glib_variant_regression 2>&1 | tee reports/glib-backport/patched.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: glib-backport-${{ github.sha }}
          path: reports/glib-backport/
          if-no-files-found: error

  desktop-tauri-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Repeat concurrent identity and cross-process lock tests
        run: |
          set -euo pipefail
          for iteration in {1..20}; do
            echo "Identity lock stress iteration $iteration of 20"
            cargo test --locked --manifest-path src-tauri/Cargo.toml identity_tests -- --test-threads=8
          done
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml

  desktop-tauri-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml

  desktop-tauri:
    runs-on: ubuntu-latest
    needs: [desktop-tauri-linux, desktop-tauri-macos, desktop-tauri-windows, glib-backport-regression]
    if: always()
    steps:
      - run: |
          for result in "${{ needs.desktop-tauri-linux.result }}" "${{ needs.desktop-tauri-macos.result }}" "${{ needs.desktop-tauri-windows.result }}" "${{ needs.glib-backport-regression.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "Desktop platform build failed: $result"
              exit 1
            fi
          done
          echo "Desktop Linux, macOS, and Windows builds passed"

  mobile-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.8"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare Android release SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=$?
          set -o pipefail
          test "$license_status" -eq 0
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
      - name: Generate non-production Android signing key
        env:
          OMNI_ANDROID_KEYSTORE_PASSWORD: omnidesk-ci-store-password
          OMNI_ANDROID_KEY_ALIAS: omnidesk-ci
          OMNI_ANDROID_KEY_PASSWORD: omnidesk-ci-store-password
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/omnidesk-ci-release.keystore"
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$OMNI_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$OMNI_ANDROID_KEY_PASSWORD" \
            -alias "$OMNI_ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=OmniDesk CI,O=OmniDesk,L=CI,C=US" \
            -noprompt
          {
            echo "OMNI_ANDROID_KEYSTORE=$keystore"
            echo "OMNI_ANDROID_KEYSTORE_PASSWORD=$OMNI_ANDROID_KEYSTORE_PASSWORD"
            echo "OMNI_ANDROID_KEY_ALIAS=$OMNI_ANDROID_KEY_ALIAS"
            echo "OMNI_ANDROID_KEY_PASSWORD=$OMNI_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: flutter build appbundle --release
        timeout-minutes: 20
      - run: python ../../scripts/check_tri_app_release_readiness.py ../.. --mode mobile-android-release

  mobile-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.8"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator --debug
      - name: Prepare iOS Simulator
        id: ios_simulator
        timeout-minutes: 8
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          candidates = [(tuple(map(int, runtime.split("iOS-")[1].split("-"))), device["udid"])
                        for runtime, devices in json.load(sys.stdin)["devices"].items() if "iOS-" in runtime
                        for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")]
          print(max(candidates)[1])')
          test -n "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "udid=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Native iOS Keychain and offline UI regression
        timeout-minutes: 15
        env:
          simulator_id: ${{ steps.ios_simulator.outputs.udid }}
          OMNI_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$simulator_id"
          evidence="$RUNNER_TEMP/omnidesk-ios-xctest"
          mkdir -p "$evidence"
          original=integration_test/ios_smoke_test.dart
          negative="integration_test/ios_smoke_negative_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.dart"
          test ! -e "$negative"
          trap 'rm -f "$negative"' EXIT
          flutter --version --machine > "$evidence/flutter-version.json"
          xcodebuild -version > "$evidence/xcode-version.txt"
          xcrun simctl list devices available -j > "$evidence/simulators.json"
          git rev-parse HEAD > "$evidence/checkout-sha.txt"
          python3 - "$original" "$negative" "$evidence/source.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          original, negative, manifest = map(Path, sys.argv[1:])
          version = json.loads((manifest.parent / 'flutter-version.json').read_text())
          assert version['frameworkVersion'] == '3.38.8', 'Expected the fixed Flutter SDK'
          source = original.read_bytes()
          needle = b"expect(await storage.read(key: key), 'native-readback');"
          assert source.count(needle) == 1, 'Expected one original Keychain assertion'
          replacement = b"expect(await storage.read(key: key), 'OMNI_IOS_XCTEST_NEGATIVE_CONTROL');"
          with negative.open('xb') as handle:
              handle.write(source.replace(needle, replacement))
          manifest.write_text(json.dumps({
              'original_path': str(original),
              'original_sha256': hashlib.sha256(source).hexdigest(),
              'negative_path': str(negative),
              'negative_sha256': hashlib.sha256(negative.read_bytes()).hexdigest(),
              'pr_head': os.environ['OMNI_PR_HEAD'],
              'simulator_udid': os.environ['simulator_id'],
              'runner_image': os.environ.get('ImageOS'),
              'runner_image_version': os.environ.get('ImageVersion'),
          }, indent=2) + '\n')
          PY
          run_xctest() {
            label=$1
            dart_target=$2
            shift 2
            flutter build ios --simulator --debug --config-only --no-pub \
              --target "$dart_target" \
              --dart-define=INTEGRATION_TEST_SHOULD_REPORT_RESULTS_TO_NATIVE=true
            cp ios/Flutter/Generated.xcconfig "$evidence/$label.Generated.xcconfig"
            python3 - "$dart_target" "$evidence/source.json" <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path
          target = Path(sys.argv[1]).resolve()
          manifest = json.loads(Path(sys.argv[2]).read_text())
          original = Path(manifest['original_path'])
          assert hashlib.sha256(original.read_bytes()).hexdigest() == manifest['original_sha256']
          config = dict(line.split('=', 1) for line in Path('ios/Flutter/Generated.xcconfig').read_text().splitlines() if '=' in line and not line.startswith('//'))
          assert Path(config['FLUTTER_TARGET']).resolve() == target, 'Wrong Dart entrypoint'
          defines = [base64.b64decode(item, validate=True).decode() for item in config['DART_DEFINES'].split(',')]
          reports = [item for item in defines if item.startswith('INTEGRATION_TEST_SHOULD_REPORT_RESULTS_TO_NATIVE=')]
          assert reports == ['INTEGRATION_TEST_SHOULD_REPORT_RESULTS_TO_NATIVE=true'], 'Native result reporting must be enabled'
          PY
            xcode_status=0
            xcodebuild test \
              -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
              -sdk iphonesimulator -destination "id=$simulator_id" \
              -parallel-testing-enabled NO \
              -derivedDataPath "$RUNNER_TEMP/omnidesk-ios-derived" \
              -resultBundlePath "$evidence/$label.xcresult" \
              -only-testing:RunnerTests > "$evidence/$label.xcodebuild.log" 2>&1 || xcode_status=$?
            cat "$evidence/$label.xcodebuild.log"
            xcrun xcresulttool get test-results summary --schema-version 0.1.0 \
              --path "$evidence/$label.xcresult" > "$evidence/$label.summary.json"
            xcrun xcresulttool get test-results tests --schema-version 0.1.0 \
              --path "$evidence/$label.xcresult" > "$evidence/$label.tests.json"
            python3 ../../scripts/check_ios_xcresult.py \
              --summary "$evidence/$label.summary.json" --tests "$evidence/$label.tests.json" \
              --xcodebuild-exit "$xcode_status" "$@" > "$evidence/$label.verified.json"
            cat "$evidence/$label.verified.json"
          }
          run_xctest negative "$negative" --expected-failure-marker OMNI_IOS_XCTEST_NEGATIVE_CONTROL
          rm "$negative"
          run_xctest positive "$original"
          python3 - "$evidence/source.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text())
          assert hashlib.sha256(Path(manifest['original_path']).read_bytes()).hexdigest() == manifest['original_sha256']
          assert not Path(manifest['negative_path']).exists()
          PY
      - run: python ../../scripts/check_tri_app_release_readiness.py ../.. --mode mobile-ios-source
      - name: Preserve iOS XCTest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-xctest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/omnidesk-ios-xctest
          if-no-files-found: error
          retention-days: 7

  mobile-ios-release:
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.8"
          cache: true
      - run: flutter pub get
      - run: flutter build ipa --release
      - run: python ../../scripts/check_tri_app_release_readiness.py ../.. --mode mobile-ios-release
