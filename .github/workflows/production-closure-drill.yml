name: Production Closure Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.bootstrap.lock
      - run: python -m pip install --require-hashes -r requirements.runtime.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python scripts/check_kubernetes_contract.py .
      - run: python scripts/production_closure_drill.py --root . --contract-only
      - run: python scripts/check_enterprise_readiness.py .
