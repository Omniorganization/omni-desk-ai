name: Soak and Chaos Test

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of deterministic soak iterations
        required: true
        default: "25"
      duration_seconds:
        description: Optional duration target for longer manual runs
        required: false
        default: "0"
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: PYTHONPATH=. python -m pytest -q -W error --timeout=60 --timeout-method=thread
      - name: Deterministic soak scenarios
        env:
          SOAK_ITERATIONS: ${{ github.event.inputs.iterations || '25' }}
          SOAK_DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '0' }}
        run: |
          [[ "$SOAK_ITERATIONS" =~ ^[0-9]+$ ]] || { echo "invalid iterations"; exit 1; }
          [[ "$SOAK_DURATION_SECONDS" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "invalid duration_seconds"; exit 1; }
          python scripts/soak_test.py --iterations "$SOAK_ITERATIONS" --duration-seconds "$SOAK_DURATION_SECONDS" --json | tee soak-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: soak-report
          path: soak-report.json
