name: Rollback Drill

on:
  workflow_dispatch:
    inputs:
      current_artifact_run_id:
        description: Release run id for the current artifact to deploy first
        required: true
      previous_artifact_run_id:
        description: Release run id for the previous artifact to roll back to
        required: true
      artifact_name:
        description: GitHub Actions artifact name
        required: true
        default: dist-and-sbom
      current_version:
        description: Expected current version
        required: true
      previous_version:
        description: Expected rollback version
        required: true
      current_image_digest:
        description: Expected current OCI image digest used by staging deploy
        required: false
        default: ""
      previous_image_digest:
        description: Expected previous OCI image digest used by rollback deploy
        required: false
        default: ""
      deploy_mode:
        description: Fixed staging deploy adapter mode
        required: true
        type: choice
        default: noop
        options:
          - noop
          - docker-compose
          - kubectl
          - systemd

permissions:
  contents: read
  actions: read
  attestations: read
  id-token: write

env:
  # Attestations are only trusted when produced by the Release Build workflow.
  RELEASE_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml

jobs:
  rollback-drill:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: PYTHONPATH=. python -m pytest tests/test_shadow_canary_upgrade_memory.py tests/test_upgrade_state_machine.py -q
      - name: Download current and previous signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_RUN_ID: ${{ inputs.current_artifact_run_id }}
          PREVIOUS_ARTIFACT_RUN_ID: ${{ inputs.previous_artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          [[ "$CURRENT_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid run id"; exit 1; }
          [[ "$PREVIOUS_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid run id"; exit 1; }
          mkdir -p current previous
          gh run download "$CURRENT_ARTIFACT_RUN_ID" --name "$ARTIFACT_NAME" --dir current
          gh run download "$PREVIOUS_ARTIFACT_RUN_ID" --name "$ARTIFACT_NAME" --dir previous
      - name: Verify release artifacts and attestations
        env:
          OMNIDESK_RELEASE_SIGNING_KEY: ${{ secrets.OMNIDESK_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ inputs.current_version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          [[ "$CURRENT_VERSION" =~ ^[0-9A-Za-z.+_-]+$ ]] || { echo "invalid version"; exit 1; }
          [[ "$PREVIOUS_VERSION" =~ ^[0-9A-Za-z.+_-]+$ ]] || { echo "invalid version"; exit 1; }
          python scripts/verify_release_artifact.py current --expected-version "$CURRENT_VERSION" --require-signatures --require-metadata
          python scripts/verify_release_signatures.py current
          python scripts/verify_release_artifact.py previous --expected-version "$PREVIOUS_VERSION" --require-signatures --require-metadata
          python scripts/verify_release_signatures.py previous
          find current previous -maxdepth 1 -type f -print0 | sort -z | while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$RELEASE_SIGNER_WORKFLOW"
          done
          current_wheel="$(find current -maxdepth 1 -type f -name '*.whl' -print -quit)"
          previous_wheel="$(find previous -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$current_wheel"
          test -n "$previous_wheel"
          {
            echo "CURRENT_SHA=$(sha256sum "$current_wheel" | awk '{print $1}')"
            echo "PREVIOUS_SHA=$(sha256sum "$previous_wheel" | awk '{print $1}')"
            echo "CURRENT_IMAGE_DIGEST=$(python scripts/read_release_metadata.py current image.digest)"
            echo "PREVIOUS_IMAGE_DIGEST=$(python scripts/read_release_metadata.py previous image.digest)"
          } >> "$GITHUB_ENV"
      - name: Deploy current artifact to staging
        env:
          OMNIDESK_DEPLOY_MODE: ${{ inputs.deploy_mode }}
          OMNIDESK_EXPECTED_VERSION: ${{ inputs.current_version }}
          OMNIDESK_ARTIFACT_SHA256: ${{ env.CURRENT_SHA }}
          OMNIDESK_DEPLOY_COMPOSE_FILE: ${{ vars.OMNIDESK_STAGING_COMPOSE_FILE }}
          OMNIDESK_DEPLOY_SERVICE: ${{ vars.OMNIDESK_STAGING_SERVICE }}
          OMNIDESK_DEPLOY_KUBE_CONTEXT: ${{ vars.OMNIDESK_STAGING_KUBE_CONTEXT }}
          OMNIDESK_DEPLOY_NAMESPACE: ${{ vars.OMNIDESK_STAGING_NAMESPACE }}
          OMNIDESK_DEPLOYMENT_NAME: ${{ vars.OMNIDESK_STAGING_DEPLOYMENT_NAME }}
          OMNIDESK_CONTAINER_NAME: ${{ vars.OMNIDESK_STAGING_CONTAINER_NAME }}
          OMNIDESK_IMAGE: ${{ vars.OMNIDESK_STAGING_IMAGE }}
          OMNIDESK_DEPLOY_HOST: ${{ vars.OMNIDESK_STAGING_HOST }}
          OMNIDESK_DEPLOY_USER: ${{ vars.OMNIDESK_STAGING_USER }}
          OMNIDESK_REMOTE_DEPLOY_SCRIPT: ${{ vars.OMNIDESK_STAGING_REMOTE_DEPLOY_SCRIPT }}
          OMNIDESK_IMAGE_DIGEST: ${{ env.CURRENT_IMAGE_DIGEST }}
        run: |
          artifact="$(find current -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$artifact"
          bash scripts/deploy_artifact.sh --artifact "$artifact" --environment staging --mode "$OMNIDESK_DEPLOY_MODE" --expected-version "$OMNIDESK_EXPECTED_VERSION" --artifact-sha256 "$CURRENT_SHA" --image-digest "$OMNIDESK_IMAGE_DIGEST"
      - name: Current staging smoke
        env:
          OMNIDESK_SMOKE_BASE_URL: ${{ vars.OMNIDESK_STAGING_BASE_URL }}
          OMNIDESK_SMOKE_ADMIN_TOKEN: ${{ secrets.OMNIDESK_STAGING_ADMIN_TOKEN }}
          CURRENT_VERSION: ${{ inputs.current_version }}
        run: python scripts/production_smoke_test.py --check-admin-metrics --check-admin-slo --fail-on-slo --expected-version "$CURRENT_VERSION" --expected-artifact-sha256 "$CURRENT_SHA"
      - name: Roll back to previous artifact
        env:
          OMNIDESK_DEPLOY_MODE: ${{ inputs.deploy_mode }}
          OMNIDESK_EXPECTED_VERSION: ${{ inputs.previous_version }}
          OMNIDESK_ARTIFACT_SHA256: ${{ env.PREVIOUS_SHA }}
          OMNIDESK_DEPLOY_COMPOSE_FILE: ${{ vars.OMNIDESK_STAGING_COMPOSE_FILE }}
          OMNIDESK_DEPLOY_SERVICE: ${{ vars.OMNIDESK_STAGING_SERVICE }}
          OMNIDESK_DEPLOY_KUBE_CONTEXT: ${{ vars.OMNIDESK_STAGING_KUBE_CONTEXT }}
          OMNIDESK_DEPLOY_NAMESPACE: ${{ vars.OMNIDESK_STAGING_NAMESPACE }}
          OMNIDESK_DEPLOYMENT_NAME: ${{ vars.OMNIDESK_STAGING_DEPLOYMENT_NAME }}
          OMNIDESK_CONTAINER_NAME: ${{ vars.OMNIDESK_STAGING_CONTAINER_NAME }}
          OMNIDESK_IMAGE: ${{ vars.OMNIDESK_STAGING_IMAGE }}
          OMNIDESK_DEPLOY_HOST: ${{ vars.OMNIDESK_STAGING_HOST }}
          OMNIDESK_DEPLOY_USER: ${{ vars.OMNIDESK_STAGING_USER }}
          OMNIDESK_REMOTE_DEPLOY_SCRIPT: ${{ vars.OMNIDESK_STAGING_REMOTE_DEPLOY_SCRIPT }}
          OMNIDESK_IMAGE_DIGEST: ${{ env.PREVIOUS_IMAGE_DIGEST }}
        run: |
          artifact="$(find previous -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$artifact"
          bash scripts/deploy_artifact.sh --artifact "$artifact" --environment staging --mode "$OMNIDESK_DEPLOY_MODE" --expected-version "$OMNIDESK_EXPECTED_VERSION" --artifact-sha256 "$PREVIOUS_SHA" --image-digest "$OMNIDESK_IMAGE_DIGEST"
      - name: Rollback staging smoke
        env:
          OMNIDESK_SMOKE_BASE_URL: ${{ vars.OMNIDESK_STAGING_BASE_URL }}
          OMNIDESK_SMOKE_ADMIN_TOKEN: ${{ secrets.OMNIDESK_STAGING_ADMIN_TOKEN }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: python scripts/production_smoke_test.py --check-admin-metrics --check-admin-slo --fail-on-slo --expected-version "$PREVIOUS_VERSION" --expected-artifact-sha256 "$PREVIOUS_SHA"
