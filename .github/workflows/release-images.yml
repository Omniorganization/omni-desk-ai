name: Release Images

# Builds the server-release images exactly as release.yml's server-release job
# does, on pull requests and without publishing or signing anything: the wheel
# once, the app image FROM that wheel (a wrong sha256 must fail the build), and
# the sandbox-runner image, then runs both. release.yml itself can only run from
# main in the protected release environment, so this is where a broken
# Dockerfile or build script is caught before it blocks a release.

on:
  pull_request:
    paths:
      - Dockerfile
      - deploy/sandbox-runner/**
      - omnidesk_agent/sandbox/**
      - scripts/build_release.sh
      - scripts/release_smoke_locked.sh
      - scripts/write_release_metadata.py
      - requirements.bootstrap.lock
      - requirements.runtime.lock
      - requirements.enterprise.lock
      - pyproject.toml
      - .github/workflows/release.yml
      - .github/workflows/release-images.yml
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_VERSION: 1.12.7+root-monorepo-production-ga-candidate

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Build the wheel once (as server-release does)
        run: bash scripts/build_release.sh
        env:
          OMNIDESK_RELEASE_DEFER_METADATA: "1"
          OMNIDESK_RELEASE_DEFER_SIGNING: "1"
      - name: The app image runs exactly that wheel and reports its sha256
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          artifact_sha="$(sha256sum "$wheel" | awk '{print $1}')"
          mkdir -p "$RUNNER_TEMP/release-wheel" && cp -- "$wheel" "$RUNNER_TEMP/release-wheel/"
          docker build -q --build-context wheel="$RUNNER_TEMP/release-wheel" \
            --build-arg OMNIDESK_VERSION="$EXPECTED_VERSION" --build-arg OMNIDESK_ARTIFACT_SHA256="$artifact_sha" \
            -t omnidesk-agent:pr .
          # The image must run exactly that wheel: compare with the version in the
          # wheel's own METADATA (the PEP 440 form, 1.12.7+root.monorepo...).
          # OMNIDESK_VERSION keeps the declared release version.
          wheel_version="$(python -c 'import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA")); print(next(l.split(": ", 1)[1] for l in z.read(meta).decode().splitlines() if l.startswith("Version: ")))' "$wheel")"
          docker run --rm --entrypoint python omnidesk-agent:pr -c 'import importlib.metadata as m, os, sys; v=m.version("omnidesk-agent"); s=os.environ["OMNIDESK_ARTIFACT_SHA256"]; print(v, s); sys.exit(0 if v == sys.argv[2] and os.environ["OMNIDESK_VERSION"] == sys.argv[3] and s == sys.argv[1] else 1)' "$artifact_sha" "$wheel_version" "$EXPECTED_VERSION"
          # A sha256 that does not match the wheel must fail the build: the image
          # can never claim an identity it does not have.
          if docker build -q --build-context wheel="$RUNNER_TEMP/release-wheel" \
               --build-arg OMNIDESK_ARTIFACT_SHA256="$(printf '%064d' 0)" -t omnidesk-agent:wrong . > /dev/null 2>&1; then
            echo "image built with a sha256 that is not its wheel's" >&2; exit 1
          fi
      - name: The wheel passes the release verifier's version check
        # staging, production and rollback run verify_release_artifact.py
        # --expected-version on this wheel; prove the declared version matches it.
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          check="$RUNNER_TEMP/version-check" && mkdir -p "$check" && cp -- "$wheel" "$check/"
          (cd "$check" && sha256sum -- *.whl > checksums.txt)
          python scripts/verify_release_artifact.py "$check" --expected-version "$EXPECTED_VERSION"
          if python scripts/verify_release_artifact.py "$check" --expected-version 0.0.0+other 2>/dev/null; then
            echo "verifier accepted a version that is not the wheel's" >&2; exit 1
          fi
      - name: The sandbox-runner image starts and refuses to run without its token
        run: |
          set -euo pipefail
          docker build -q -f deploy/sandbox-runner/Dockerfile -t omnidesk-sandbox-runner:pr .
          docker run --rm --entrypoint python omnidesk-sandbox-runner:pr -c 'import omnidesk_agent.sandbox.runner_server'
          out="$(docker run --rm omnidesk-sandbox-runner:pr 2>&1 || true)"
          echo "$out" | tail -n 3
          echo "$out" | grep -q "refuses to start without OMNIDESK_SANDBOX_RUNNER_TOKEN"
      - name: Server release metadata is labelled server-staging-only
        run: |
          set -euo pipefail
          python scripts/write_release_metadata.py dist --image-ref ghcr.io/example/omnidesk-agent:pr \
            --image-digest "sha256:$(printf '%064d' 1)" --release-scope server-staging-only \
            --sandbox-runner-image-ref ghcr.io/example/omnidesk-sandbox-runner:pr \
            --sandbox-runner-image-digest "sha256:$(printf '%064d' 2)"
          test "$(python scripts/read_release_metadata.py dist release_scope)" = "server-staging-only"
