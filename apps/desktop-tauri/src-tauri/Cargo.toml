[package]
name = "omnidesk_desktop"
version = "1.12.7"
edition = "2021"
rust-version = "1.90"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4", default-features = true }
fs2 = "0.4.3"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "jwk", "pem", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
glib = { path = "vendor/glib" }
