[package]
name = "omnidesk_desktop"
version = "1.12.7"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4", default-features = true }
fs2 = "0.4.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
glib = { path = "vendor/glib" }
