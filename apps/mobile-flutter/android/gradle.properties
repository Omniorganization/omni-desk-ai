org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# local_auth_android still applies kotlin-android. Use AGP 9's documented
# transition mode until that upstream plugin migrates to built-in Kotlin.
android.builtInKotlin=false
# Flutter 3.38's Gradle plugin has not yet migrated to AGP 9's new DSL.
# Keep the legacy DSL during this supported transition while retaining API 37.
android.newDsl=false
